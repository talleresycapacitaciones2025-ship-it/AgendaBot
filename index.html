<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>AgendaBot · Calendario Inteligente</title>

    <!-- Iconos para navegador y pantalla de inicio (móvil) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%236d28d9'/%3E%3Ctext x='50' y='68' font-size='50' text-anchor='middle' fill='white' font-family='Arial'%3E📅%3C/text%3E%3C/svg%3E">
    <link rel="apple-touch-icon" sizes="180x180" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='30' fill='%236d28d9'/%3E%3Ctext x='90' y='115' font-size='90' text-anchor='middle' fill='white' font-family='Arial'%3E📅%3C/text%3E%3C/svg%3E">
    <meta name="theme-color" content="#6d28d9">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AgendaBot">

    <!-- FullCalendar CSS + JS + locale español -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/locales/es.global.min.js"></script>

    <style>
        :root {
            --bg: #eef2f9;
            --bg-accent-1: rgba(109, 40, 217, 0.10);
            --bg-accent-2: rgba(59, 130, 246, 0.10);
            --card: rgba(255, 255, 255, 0.85);
            --card-solid: #ffffff;
            --text: #0f172a;
            --text-soft: #64748b;
            --border: rgba(148, 163, 184, 0.35);
            --input-bg: #f8fafc;
            --bot-bubble: #eef2f7;
            --user-bubble: linear-gradient(135deg, #3b82f6, #6d28d9);
            --shadow: 0 20px 45px rgba(15, 23, 42, 0.08);
            --grad: linear-gradient(135deg, #1e3a8a, #6d28d9);
            --grad-btn: linear-gradient(135deg, #3b82f6, #8b5cf6);
        }
        body.dark {
            --bg: #0b1120;
            --bg-accent-1: rgba(109, 40, 217, 0.22);
            --bg-accent-2: rgba(59, 130, 246, 0.18);
            --card: rgba(17, 25, 45, 0.85);
            --card-solid: #11192d;
            --text: #e2e8f0;
            --text-soft: #94a3b8;
            --border: rgba(148, 163, 184, 0.22);
            --input-bg: #0f1830;
            --bot-bubble: #1e2a45;
            --shadow: 0 20px 45px rgba(0, 0, 0, 0.45);
            --grad: linear-gradient(135deg, #93c5fd, #c4b5fd);
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
        }
        body {
            min-height: 100vh;
            background:
                radial-gradient(900px 500px at 15% -10%, var(--bg-accent-1), transparent 60%),
                radial-gradient(900px 500px at 90% 110%, var(--bg-accent-2), transparent 60%),
                var(--bg);
            color: var(--text);
            padding: 18px 14px;
            transition: background 0.4s ease, color 0.3s ease;
        }

        .container {
            max-width: 1240px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.1rem;
        }
        .container.calendar-open {
            grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);
        }

        .card {
            background: var(--card);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--border);
            border-radius: 26px;
            box-shadow: var(--shadow);
            padding: 1.15rem 1.25rem;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        /* ===== Encabezado ===== */
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            margin-bottom: 0.9rem;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            margin: 0;
            font-size: 1.35rem;
            font-weight: 800;
            background: var(--grad);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .brand .logo {
            width: 40px; height: 40px;
            display: grid; place-items: center;
            background: var(--grad-btn);
            border-radius: 14px;
            font-size: 1.15rem;
            box-shadow: 0 8px 18px rgba(109, 40, 217, 0.35);
        }
        h3.section-title {
            margin: 0;
            font-size: 1.05rem;
            font-weight: 700;
            background: var(--grad);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        /* Interruptor modo oscuro */
        .theme-toggle {
            border: 1px solid var(--border);
            background: var(--input-bg);
            color: var(--text);
            width: 42px; height: 42px;
            border-radius: 50%;
            display: grid; place-items: center;
            cursor: pointer;
            font-size: 1.05rem;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            padding: 0;
        }
        .theme-toggle:hover { transform: rotate(15deg) scale(1.06); }

        /* ===== Botones rápidos ===== */
        .quick-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 0.55rem;
            margin-bottom: 0.9rem;
        }
        .quick-btn {
            background: var(--input-bg);
            color: var(--text);
            padding: 0.5rem 1.05rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.2s ease;
            border: 1px solid var(--border);
            user-select: none;
        }
        .quick-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(59, 130, 246, 0.18);
        }
        .quick-btn.active {
            background: var(--grad-btn);
            color: #fff;
            border-color: transparent;
        }

        /* ===== Chat ===== */
        .messages {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 0.85rem;
            padding: 0.9rem;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            min-height: 320px;
            max-height: 58vh;
            scroll-behavior: smooth;
        }
        .messages::-webkit-scrollbar { width: 8px; }
        .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }

        .message {
            max-width: 85%;
            padding: 0.65rem 1.05rem;
            border-radius: 22px;
            font-size: 0.9rem;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
            animation: pop 0.25s ease;
        }
        @keyframes pop {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message strong { font-weight: 700; }
        .user {
            background: var(--user-bubble);
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 6px;
            box-shadow: 0 6px 14px rgba(59, 130, 246, 0.25);
        }
        .bot {
            background: var(--bot-bubble);
            color: var(--text);
            align-self: flex-start;
            border-bottom-left-radius: 6px;
        }

        /* Indicador escribiendo */
        .typing { display: inline-flex; gap: 5px; align-items: center; padding: 0.8rem 1.1rem; }
        .typing span {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--text-soft);
            animation: blink 1.2s infinite;
        }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink {
            0%, 80%, 100% { opacity: 0.3; transform: translateY(0); }
            40% { opacity: 1; transform: translateY(-4px); }
        }

        /* ===== Entrada ===== */
        .input-area { display: flex; gap: 0.65rem; }
        input[type="text"] {
            flex: 1;
            padding: 0.85rem 1.15rem;
            border-radius: 48px;
            border: 1px solid var(--border);
            background: var(--input-bg);
            color: var(--text);
            font-size: 0.92rem;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        input[type="text"]:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.18);
        }
        button.send {
            background: var(--grad-btn);
            color: #fff;
            border: none;
            border-radius: 48px;
            padding: 0 1.6rem;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.9rem;
            transition: opacity 0.2s ease, transform 0.15s ease;
        }
        button.send:hover:not(:disabled) { transform: translateY(-1px); opacity: 0.95; }
        button.send:disabled { opacity: 0.55; cursor: not-allowed; }

        /* ===== Calendario ===== */
        .calendar-panel { display: none; }
        .calendar-panel.visible { display: flex; }
        .calendar-hint {
            font-size: 0.72rem;
            color: var(--text-soft);
            margin: 0.7rem 0 0 0;
        }
        .fc { font-size: 0.85rem; --fc-border-color: var(--border); --fc-page-bg-color: transparent; }
        .fc .fc-button-primary {
            background: var(--grad-btn);
            border: none;
            text-transform: capitalize;
            border-radius: 12px;
        }
        .fc .fc-button-primary:not(:disabled).fc-button-active,
        .fc .fc-button-primary:hover { opacity: 0.9; background: var(--grad-btn); }
        .fc .fc-col-header-cell-cushion, .fc .fc-daygrid-day-number { color: var(--text); text-decoration: none; }
        .fc-theme-standard td, .fc-theme-standard th, .fc-theme-standard .fc-scrollgrid { border-color: var(--border); }
        .fc-daygrid-event {
            background: linear-gradient(135deg, #6d28d9, #8b5cf6);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            padding: 2px 6px;
        }
        .fc-daygrid-event .fc-event-title, .fc-daygrid-event .fc-event-time {
            color: #fff !important;
            font-weight: 600 !important;
        }
        .fc-day-today { background-color: var(--bg-accent-2) !important; }
        .fc .fc-list-empty { background: transparent; color: var(--text-soft); }

        footer {
            text-align: center;
            margin-top: 1.2rem;
            font-size: 0.72rem;
            color: var(--text-soft);
        }

        /* ===== Responsive ===== */
        @media (max-width: 900px) {
            .container.calendar-open { grid-template-columns: 1fr; }
            .messages { max-height: 50vh; }
        }
        @media (max-width: 480px) {
            body { padding: 10px; }
            .card { padding: 0.9rem; border-radius: 22px; }
            .messages { max-height: 46vh; min-height: 260px; }
            .quick-btn { font-size: 0.72rem; padding: 0.4rem 0.85rem; }
            button.send { padding: 0 1.1rem; }
            .brand { font-size: 1.15rem; }
        }
    </style>
</head>
<body>
<div class="container" id="mainContainer">
    <div class="card chat-panel">
        <div class="card-header">
            <h2 class="brand"><span class="logo">🤖</span> AgendaBot</h2>
            <button class="theme-toggle" id="themeToggle" title="Cambiar tema" aria-label="Cambiar tema">🌙</button>
        </div>
        <div class="quick-buttons">
            <div class="quick-btn" data-msg="¿Qué tengo hoy?">📌 Hoy</div>
            <div class="quick-btn" data-msg="¿Qué tengo esta semana?">📆 Esta semana</div>
            <div class="quick-btn" id="toggleCalendarBtn">🗓️ Mostrar calendario</div>
        </div>
        <div class="messages" id="messages" aria-live="polite"></div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Ej: Agenda firma el viernes a las 3pm" autofocus>
            <button class="send" id="sendBtn">Enviar</button>
        </div>
    </div>

    <div class="card calendar-panel" id="calendarPanel">
        <h3 class="section-title">📅 Calendario</h3>
        <div id="calendar"></div>
        <p class="calendar-hint">🔍 Haz clic en un evento para cancelarlo</p>
    </div>
</div>
<footer>⚡ Los eventos se guardan en la nube. Pregunta: "¿Qué tengo hoy?", "¿Qué tengo esta semana?"</footer>

<script>
    const WORKER_URL = "https://agenda-bot.dianaml76.workers.dev/chat";
    const EVENTOS_URL = "https://agenda-bot.dianaml76.workers.dev/eventos";

    const messagesDiv = document.getElementById('messages');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const toggleCalendarBtn = document.getElementById('toggleCalendarBtn');
    const calendarPanel = document.getElementById('calendarPanel');
    const mainContainer = document.getElementById('mainContainer');
    const themeToggle = document.getElementById('themeToggle');
    let calendar = null;

    /* ===== Tema claro / oscuro (persistente) ===== */
    function aplicarTema(tema) {
        document.body.classList.toggle('dark', tema === 'dark');
        themeToggle.textContent = tema === 'dark' ? '☀️' : '🌙';
    }
    const temaGuardado = localStorage.getItem('agendabot-tema')
        || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    aplicarTema(temaGuardado);
    themeToggle.addEventListener('click', () => {
        const nuevo = document.body.classList.contains('dark') ? 'light' : 'dark';
        aplicarTema(nuevo);
        localStorage.setItem('agendabot-tema', nuevo);
    });

    /* ===== Mensajes ===== */
    function escapeHTML(str) {
        return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                  .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    function addMessage(text, type) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${type}`;
        if (type === 'bot') {
            let formatted = escapeHTML(String(text));
            formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            formatted = formatted.replace(/^[•\-]\s+/gm, '🔹 ');
            formatted = formatted.replace(/•/g, '🔹');
            formatted = formatted.replace(/\n/g, '<br>');
            msgDiv.innerHTML = formatted;
        } else {
            msgDiv.innerText = text;
        }
        messagesDiv.appendChild(msgDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    let typingDiv = null;
    function showTyping() {
        hideTyping();
        typingDiv = document.createElement('div');
        typingDiv.className = 'message bot typing';
        typingDiv.setAttribute('aria-label', 'Escribiendo');
        typingDiv.innerHTML = '<span></span><span></span><span></span>';
        messagesDiv.appendChild(typingDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
    function hideTyping() {
        if (typingDiv) typingDiv.remove();
        typingDiv = null;
    }

    function setSending(estado) {
        sendBtn.disabled = estado;
        userInput.disabled = estado;
        if (!estado) userInput.focus();
    }

    async function sendMessage(text = null) {
        const message = text || userInput.value.trim();
        if (!message) return;
        if (!text) userInput.value = '';
        addMessage(message, 'user');
        showTyping();
        setSending(true);
        try {
            const res = await fetch(WORKER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: message })
            });
            const data = await res.json();
            hideTyping();
            addMessage(data.respuesta_texto || "❌ Respuesta vacía", 'bot');
            if (calendarPanel.classList.contains('visible')) await cargarEventosCalendario();
        } catch (err) {
            hideTyping();
            console.error(err);
            addMessage("❌ Error de conexión con el Worker", 'bot');
        } finally {
            setSending(false);
        }
    }

    function formatearHoraCompleta(hora) {
        if (!hora) return "";
        const partes = hora.split(':');
        if (partes.length !== 2) return hora;
        const h = partes[0];
        let m = partes[1];
        if (m.length === 1) m = '0' + m;
        return `${h}:${m}`;
    }

    async function cargarEventosCalendario() {
        try {
            const resp = await fetch(EVENTOS_URL);
            const eventos = await resp.json();
            const eventosFormateados = eventos.map(ev => {
                const [year, month, day] = ev.fecha.split('-').map(Number);
                let [hour, minute] = ev.hora.split(':').map(Number);
                if (isNaN(minute)) minute = 0;
                const fechaLocal = new Date(year, month - 1, day, hour, minute);
                if (isNaN(fechaLocal.getTime())) return null;
                const horaCompleta = formatearHoraCompleta(ev.hora);
                const tituloConHora = `${ev.titulo} ${horaCompleta}`;
                return { id: ev.id, title: tituloConHora, start: fechaLocal, extendedProps: { id: ev.id } };
            }).filter(ev => ev !== null);

            if (calendar) {
                calendar.removeAllEvents();
                calendar.addEventSource(eventosFormateados);
            } else {
                const calendarEl = document.getElementById('calendar');
                calendar = new FullCalendar.Calendar(calendarEl, {
                    initialView: 'dayGridMonth',
                    locale: 'es',
                    headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,timeGridWeek' },
                    buttonText: { today: 'Hoy', month: 'Mes', week: 'Semana', day: 'Día' },
                    eventTimeFormat: { hour: '2-digit', minute: '2-digit', hour12: false },
                    events: eventosFormateados,
                    eventClick: function (info) {
                        const idEvento = info.event.id;
                        const titulo = info.event.title;
                        const fechaStr = info.event.start.toISOString().slice(0, 10);
                        if (confirm(`¿Cancelar evento "${titulo}" del ${fechaStr}?`)) {
                            sendMessage(`Cancela id:${idEvento}`);
                        }
                    }
                });
                calendar.render();
            }
        } catch (err) {
            console.error("Error cargando calendario", err);
        }
    }

    toggleCalendarBtn.addEventListener('click', async () => {
        const isVisible = calendarPanel.classList.contains('visible');
        if (!isVisible) {
            calendarPanel.classList.add('visible');
            mainContainer.classList.add('calendar-open');
            toggleCalendarBtn.classList.add('active');
            toggleCalendarBtn.textContent = '🗓️ Ocultar calendario';
            await cargarEventosCalendario();
        } else {
            calendarPanel.classList.remove('visible');
            mainContainer.classList.remove('calendar-open');
            toggleCalendarBtn.classList.remove('active');
            toggleCalendarBtn.textContent = '🗓️ Mostrar calendario';
        }
    });

    sendBtn.addEventListener('click', () => sendMessage());
    userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
    document.querySelectorAll('.quick-btn').forEach(btn => {
        if (btn.id !== 'toggleCalendarBtn') {
            btn.addEventListener('click', () => {
                const msg = btn.getAttribute('data-msg');
                if (msg) sendMessage(msg);
            });
        }
    });

    addMessage("👋 ¡Hola! Prueba: 'Agenda firma el viernes a las 3pm', '¿Qué tengo hoy?' o '¿Qué tengo esta semana?'", 'bot');
</script>
</body>
</html>
